# Rebuilds data/odds.json from Basketball-Reference every day and on demand, then commits it to main.
# If the build fails (blocked, page changed, bad data) the job fails and the previous odds.json stays.
# GitHub Pages serves main, so the live site updates after the push.
name: Refresh odds

on:
  schedule:
    - cron: "0 10 * * *"   # every day at 10:00 UTC
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write           # needed to push the updated file

concurrency:
  group: refresh-odds       # never run two refreshes at once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build odds.json from Basketball-Reference
        run: python pipeline/build_odds.py

      - name: Commit and push if the file changed
        run: |
          if git diff --quiet data/odds.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json
          git commit -m "Refresh odds data (automated)"
          git push
