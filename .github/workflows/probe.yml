# TEMPORARY (Phase 3 spike): runs the source probe from GitHub's servers to see whether
# Basketball-Reference accepts requests from Actions. Makes no commits. Delete after the spike.
name: Probe data sources

on:
  workflow_dispatch:
  push:
    branches: [feature/data-spike]
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Probe Basketball-Reference (7 requests, 4s apart)
        run: python pipeline/spike/probe_sources.py
